<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 页面未找到 | 伤口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0e14;
    color: #e0e4e8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .container {
    text-align: center;
    padding: 40px;
    position: relative;
    z-index: 1;
  }

  /* 背景动画 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background:
      radial-gradient(ellipse at 30% 50%, rgba(212, 160, 83, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 50%, rgba(44, 165, 199, 0.06) 0%, transparent 50%);
    z-index: -1;
  }

  /* 404 数字 */
  .error-code {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 150px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #d4a053 0%, #2ca5c7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* 标题 */
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #e0e4e8;
  }

  /* 描述 */
  p {
    font-size: 16px;
    color: #7a8a9d;
    line-height: 1.6;
    margin-bottom: 40px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }

  /* 按钮 */
  .btn {
    display: inline-block;
    padding: 14px 32px;
    background: linear-gradient(135deg, #d4a053 0%, #e17055 100%);
    color: #0a0e14;
    text-decoration: none;
    border-radius: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
  }

  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(212, 160, 83, 0.3);
  }

  /* 装饰元素 */
  .decoration {
    position: absolute;
    border: 1px solid rgba(212, 160, 83, 0.1);
    border-radius: 50%;
    pointer-events: none;
  }

  .decoration-1 {
    width: 300px; height: 300px;
    top: -100px; right: -100px;
    animation: spin 20s linear infinite;
  }

  .decoration-2 {
    width: 200px; height: 200px;
    bottom: -50px; left: -50px;
    animation: spin 25s linear infinite reverse;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* 坐标标记 */
  .coord {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: rgba(212, 160, 83, 0.3);
    margin-top: 60px;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<div class="container">
  <div class="decoration decoration-1"></div>
  <div class="decoration decoration-2"></div>

  <div class="error-code">404</div>
  <h1>页面未找到</h1>
  <p>你访问的页面可能已被移除、更改名称，或暂时不可用。</p>
  <a href="index.html" class="btn">返回首页</a>

  <div class="coord">N 30°45′ &nbsp; E 104°04′ · Lost in Space</div>
</div>

</body>
</html>
